{% load static %}
<!DOCTYPE html>
<html>
<head>
    <title>Order - {{ frame.name }}</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="{% static 'css/index.css' %}">
</head>
<body class="order-page">

    <div class="box">
        <h2>{{ frame.name }}</h2>
        <p class="price">Rs. {{ frame.price }}</p>
        <p class="size">{{ frame.size }}</p>

        <form method="POST" enctype="multipart/form-data">
            {% csrf_token %}
            <label>Name:</label>
            <input type="text" name="name" placeholder="Enter your Name" required>

            <label>Phone Number:</label>
            <input type="text" name="phone" placeholder="Enter Your Mobile Number" required>

            <label>Address:</label>
            <textarea name="address" rows="3" placeholder="Full Address" required></textarea>

            <label>Photo Upload Pannunga:</label>
            <input type="file" name="photo" accept="image/*" required>

            <button type="submit">Proceed to Payment - Rs. {{ frame.price }}</button>
        </form>

        <a href="/" class="back">← Back to Home</a>
    </div>

</body>
</html>
